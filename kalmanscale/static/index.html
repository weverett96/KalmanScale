<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KalmanScale</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div class="page">

  <div class="header">
    <img src="/static/logo.png" alt="">
    <h1>KalmanScale</h1>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Log entry</h2>
      <form id="entry-form">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="weight">Weight <span class="unit">lb</span></label>
            <input type="number" step="0.1" id="weight" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cal_in">Cal in <span class="unit">kcal</span></label>
            <input type="number" step="1" id="cal_in">
          </div>
          <div class="field">
            <label for="cal_out">Cal out <span class="unit">kcal</span></label>
            <input type="number" step="1" id="cal_out">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="body_fat_pct">Body fat <span class="unit">% (Garmin Index)</span></label>
            <input type="number" step="0.1" id="body_fat_pct">
          </div>
        </div>
        <button type="submit" class="primary">Save entry</button>
      </form>

      <div class="sync-row" style="margin-top: 0.9rem;">
        <button type="button" id="sync-btn">Sync from Whoop</button>
        <span class="sync-note">backfills cal_out for completed days only</span>
      </div>
      <div id="sync-status"></div>
    </div>

    <div class="card">
      <h2>Filtered trend</h2>
      <div id="stats"></div>
    </div>
  </div>

  <div class="card">
    <h2>Chart</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div class="table-scroll">
      <table id="entries-table">
        <thead><tr><th>Date</th><th>Weight</th><th>Cal in</th><th>Cal out</th><th>Body fat %</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
