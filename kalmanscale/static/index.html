<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KalmanScale</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div class="page">

  <div class="header">
    <img src="/static/logo.png" alt="">
    <h1>KalmanScale</h1>
  </div>

  <div class="card">
    <div class="sync-row">
      <button type="button" id="sync-btn" class="primary">Sync from intervals.icu</button>
      <span class="sync-note">Garmin Index weight &amp; body fat, cycling ride kJ &middot; last 30 days</span>
    </div>
    <div id="sync-status"></div>
  </div>

  <div class="card">
    <h2>Body measurements</h2>
    <div class="field-row">
      <div class="field">
        <label for="height_in">Height <span class="unit">in</span></label>
        <input type="number" step="0.1" id="height_in">
      </div>
      <div class="field">
        <label for="neck_in">Neck <span class="unit">in</span></label>
        <input type="number" step="0.1" id="neck_in">
      </div>
    </div>
    <div class="sync-note">Current values only, no history. Used with abdomen (logged in intervals.icu, at the navel) for the Navy body-fat formula.</div>
  </div>

  <div class="card">
    <h2>Filtered trend</h2>
    <div id="stats"></div>
  </div>

  <div class="card">
    <h2>Chart</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div class="table-scroll">
      <table id="entries-table">
        <thead><tr><th>Date</th><th>Weight</th><th>Body fat %</th><th>Abdomen in</th><th>Prev-day ride kcal</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
