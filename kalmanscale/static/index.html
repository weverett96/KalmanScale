<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KalmanScale</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 2em auto; }
  label { display: inline-block; width: 90px; }
  input { margin-bottom: 0.4em; }
  table { border-collapse: collapse; width: 100%; margin-top: 1em; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  #stats { margin-top: 1em; padding: 0.5em; background: #f5f5f5; }
  button { margin-top: 0.3em; }
</style>
</head>
<body>

<h1>KalmanScale</h1>

<form id="entry-form">
  <div><label>Date</label><input type="date" id="date" required></div>
  <div><label>Weight</label><input type="number" step="0.1" id="weight" required> lb</div>
  <div><label>Cal in</label><input type="number" step="1" id="cal_in"> kcal</div>
  <div><label>Cal out</label><input type="number" step="1" id="cal_out">
    kcal <button type="button" id="sync-btn">Sync from Whoop</button>
  </div>
  <button type="submit">Save entry</button>
</form>
<div id="sync-status"></div>

<div id="stats"></div>

<canvas id="chart" height="120"></canvas>

<table id="entries-table">
  <thead><tr><th>Date</th><th>Weight</th><th>Cal in</th><th>Cal out</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<script>
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}

document.getElementById("date").valueAsDate = new Date();

document.getElementById("sync-btn").addEventListener("click", async () => {
  const status = document.getElementById("sync-status");
  status.textContent = "Syncing...";
  try {
    const result = await api("/api/whoop/sync", { method: "POST" });
    if (result.kcal === null) {
      status.textContent = `Cycle for ${result.date} not fully scored yet (${result.score_state}). Try again later.`;
    } else {
      document.getElementById("cal_out").value = result.kcal.toFixed(0);
      status.textContent = `Filled cal_out from Whoop cycle ${result.date}.`;
    }
  } catch (e) {
    status.textContent = "Sync failed: " + e.message;
  }
});

document.getElementById("entry-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = {
    date: document.getElementById("date").value,
    weight: parseFloat(document.getElementById("weight").value),
    cal_in: document.getElementById("cal_in").value ? parseFloat(document.getElementById("cal_in").value) : null,
    cal_out: document.getElementById("cal_out").value ? parseFloat(document.getElementById("cal_out").value) : null,
  };
  await api("/api/entries", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  document.getElementById("sync-status").textContent = "";
  await refresh();
});

async function deleteEntry(date) {
  await api(`/api/entries/${date}`, { method: "DELETE" });
  await refresh();
}

let chart = null;

function renderStats(latest) {
  const el = document.getElementById("stats");
  if (!latest) { el.textContent = "No entries yet."; return; }
  const betaWk = (latest.beta * 7).toFixed(2);
  const distinguishable = Math.abs(latest.beta_z) > 1.96 ? "yes" : "not yet";
  el.innerHTML = `
    <strong>Filtered weight:</strong> ${latest.x.toFixed(1)} lb (&plusmn;${latest.se_x.toFixed(2)})<br>
    <strong>Trend (&beta;):</strong> ${betaWk} lb/wk (&plusmn;${(latest.se_beta * 7).toFixed(2)}/wk) —
      distinguishable from zero: ${distinguishable}
      <span style="color:#888">(caveat: may reflect residual/unexplained trend, not the whole trend — see plan Section 6)</span><br>
    <strong>Bias (b):</strong> ${latest.b.toFixed(0)} kcal/day (&plusmn;${latest.se_b.toFixed(0)})<br>
    <strong>Water-weight transient (e):</strong> ${latest.e.toFixed(2)} lb
  `;
}

function renderChart(entries, trajectory) {
  const labels = trajectory.map(r => r.date);
  const raw = entries.map(e => e.weight);
  const filtered = trajectory.map(r => r.x);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: "Raw weight", data: raw, borderColor: "#ccc", pointRadius: 3, showLine: false },
        { label: "Filtered trend", data: filtered, borderColor: "#2563eb", pointRadius: 0 },
      ],
    },
    options: { scales: { y: { title: { display: true, text: "lb" } } } },
  });
}

function renderTable(entries) {
  const tbody = document.querySelector("#entries-table tbody");
  tbody.innerHTML = "";
  for (const e of [...entries].reverse()) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${e.date}</td><td>${e.weight}</td><td>${e.cal_in ?? ""}</td><td>${e.cal_out ?? ""}</td>
      <td><button data-date="${e.date}">delete</button></td>
    `;
    tr.querySelector("button").addEventListener("click", () => deleteEntry(e.date));
    tbody.appendChild(tr);
  }
}

async function refresh() {
  const entries = await api("/api/entries");
  const filterResult = await api("/api/filter");
  renderStats(filterResult.latest);
  renderChart(entries, filterResult.trajectory);
  renderTable(entries);
}

refresh();
</script>

</body>
</html>
